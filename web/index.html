<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>병원 길잡이 Agent</title>
  <meta name="description" content="증상을 말하면 응급실에 가야 할지, 외래라면 어느 진료과로 갈지 근거와 함께 안내하는 학습용 참고 서비스입니다.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@700&family=Instrument+Sans:wght@400;500&family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
        <div>
          <h1>병원 길잡이</h1>
          <p>응급실? 외래? 증상을 말씀해 보세요</p>
        </div>
      </div>
      <button class="btn" id="reset" type="button">새 대화</button>
    </header>

    <p class="notice">개인 학습용 프로젝트입니다. 안내는 <b>단순 참고용</b>이며 의사의 진단을 대신하지 않습니다. 응급이 의심되면 즉시 <b>119</b>에 연락하세요.</p>

    <main class="chat" id="chat" aria-live="polite"></main>

    <form class="composer" id="form" autocomplete="off">
      <div class="tray">
        <textarea id="input" rows="1" placeholder="증상을 입력하세요" aria-label="증상 입력"></textarea>
        <button class="btn btn--primary" id="send" type="submit">전송</button>
      </div>
      <p class="fine"><span class="hint">Enter로 전송하고 Shift+Enter로 줄을 바꿉니다. </span>이 서비스는 의료 서비스가 아니며 정확성을 보장하지 않습니다.</p>
    </form>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const EXAMPLES = [
      "어제부터 설사랑 극심한 두통이 있어요",
      "가슴이 답답하고 숨이 차요",
      "아이가 밤에 열이 나요",
      "배가 아픈데 어느 과로 가야 하나요?",
    ];

    // session_id: keeps the conversation (multi-turn). sessionStorage may be unavailable, so fall back to memory.
    let sessionId = null;
    function newSession() {
      sessionId = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()) + Math.random().toString(16).slice(2);
      try { sessionStorage.setItem("sid", sessionId); } catch (_) {}
    }
    try { sessionId = sessionStorage.getItem("sid"); } catch (_) {}
    if (!sessionId) newSession();

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function alertIcon() {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("width", "20"); svg.setAttribute("height", "20"); svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none"); svg.setAttribute("stroke", "currentColor"); svg.setAttribute("stroke-width", "2.4");
      svg.setAttribute("stroke-linecap", "round"); svg.setAttribute("stroke-linejoin", "round"); svg.setAttribute("aria-hidden", "true");
      const p = document.createElementNS(ns, "path");
      p.setAttribute("d", "M12 4 3 20h18L12 4zM12 10v4.5M12 17.5v.01");
      svg.appendChild(p);
      return svg;
    }

    // Safe rendering: text only, with **bold** turned into <b> without allowing any HTML from the server.
    function setRichText(node, text) {
      node.textContent = "";
      text.split(/(\*\*[^*]+\*\*)/g).forEach((part) => {
        if (part.startsWith("**") && part.endsWith("**") && part.length > 4) node.appendChild(el("b", "", part.slice(2, -2)));
        else node.appendChild(document.createTextNode(part));
      });
    }

    // The lead sentence of an emergency answer: the number 119 is set large.
    function setLead(node, text) {
      node.textContent = "";
      text.split(/(119)/g).forEach((part) => {
        if (part === "119") node.appendChild(el("span", "n119", part));
        else node.appendChild(document.createTextNode(part));
      });
    }

    function scrollDown() { chat.scrollTop = chat.scrollHeight; }

    function showEmpty() {
      chat.textContent = "";
      const box = el("div", "empty");
      box.appendChild(el("h2", "", "어디가 불편하신가요?"));
      box.appendChild(el("p", "lead", "증상을 말씀하시면 응급실에 가야 할지, 외래라면 어느 과가 좋을지 근거와 함께 안내해 드려요."));
      const chips = el("div", "chips");
      EXAMPLES.forEach((t) => {
        const c = el("button", "btn chip", t);
        c.type = "button";
        c.addEventListener("click", () => send(t));
        chips.appendChild(c);
      });
      box.appendChild(chips);
      chat.appendChild(box);
    }

    function addUser(text) {
      const row = el("div", "row row--user");
      row.appendChild(el("div", "bubble", text));
      chat.appendChild(row);
      scrollDown();
    }

    function addTyping() {
      const row = el("div", "row row--bot");
      const b = el("div", "bubble");
      b.appendChild(el("span", "typing", "답변을 준비하는 중이에요"));
      row.appendChild(b);
      chat.appendChild(row);
      scrollDown();
      return row;
    }

    function addDetails(wrap, title, build) {
      const d = el("details", "details");
      d.appendChild(el("summary", "", title));
      const box = el("div", "box");
      build(box);
      d.appendChild(box);
      wrap.appendChild(d);
    }

    function addBot(data, isError) {
      const row = el("div", "row row--bot");
      const wrap = el("div", "stack");
      const bubble = el("div", "bubble");
      const answer = data.answer.trim();
      const isAlert = !isError && answer.startsWith("🚨");

      if (isAlert) {
        // Emergency answer: ink band. The first paragraph is the lead, the rest follows beneath it.
        const body = answer.replace(/^🚨\s*/, "");
        const cut = body.indexOf("\n\n");
        const lead = cut === -1 ? body : body.slice(0, cut);
        const rest = cut === -1 ? "" : body.slice(cut + 2);
        bubble.classList.add("bubble--alert");
        bubble.setAttribute("role", "alert");
        const head = el("div", "alert-head");
        const badge = el("span", "alert-badge");
        badge.appendChild(alertIcon());
        const leadEl = el("p", "alert-lead");
        setLead(leadEl, lead);
        head.append(badge, leadEl);
        bubble.appendChild(head);
        if (rest) {
          const restEl = el("div", "alert-rest");
          setRichText(restEl, rest);
          bubble.appendChild(restEl);
        }
      } else {
        setRichText(bubble, data.answer);
        if (isError) bubble.classList.add("bubble--error");
      }
      wrap.appendChild(bubble);

      if (data.contexts && data.contexts.length) {
        addDetails(wrap, `근거 문서 ${data.contexts.length}건`, (box) => {
          data.contexts.forEach((c) => {
            const it = el("div", "item");
            it.appendChild(el("code", "", c.doc_id));
            it.appendChild(document.createTextNode("\n" + c.text));
            box.appendChild(it);
          });
        });
      }
      if (data.trace && data.trace.length) {
        addDetails(wrap, `처리 과정 ${data.trace.length}단계`, (box) => {
          data.trace.forEach((s) => {
            const it = el("div", "item");
            it.appendChild(el("code", "", s.step));
            it.appendChild(document.createTextNode(`\n입력: ${s.input}\n출력: ${s.output}`));
            box.appendChild(it);
          });
        });
      }
      row.appendChild(wrap);
      chat.appendChild(row);
      scrollDown();
    }

    let busy = false;
    async function send(text) {
      text = (text || "").trim();
      if (!text || busy) return;
      if (chat.querySelector(".empty")) chat.textContent = "";
      busy = true; sendBtn.disabled = true; sendBtn.setAttribute("aria-busy", "true");
      addUser(text);
      input.value = ""; autosize();
      const typing = addTyping();
      try {
        const res = await fetch("/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: text, session_id: sessionId }),
        });
        if (!res.ok) throw new Error("서버 응답 오류 (" + res.status + ")");
        const data = await res.json();
        typing.remove();
        addBot(data, false);
      } catch (err) {
        typing.remove();
        addBot({ answer: "답변을 받지 못했어요. 잠시 후 다시 시도해 주세요.\n(" + err.message + ")", contexts: [], trace: [] }, true);
      } finally {
        busy = false; sendBtn.disabled = false; sendBtn.removeAttribute("aria-busy"); input.focus();
      }
    }

    function autosize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 144) + "px";
    }

    form.addEventListener("submit", (e) => { e.preventDefault(); send(input.value); });
    input.addEventListener("input", autosize);
    // Enter sends; Shift+Enter = newline; ignore Enter while a Korean IME is still composing a syllable.
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
        e.preventDefault();
        send(input.value);
      }
    });
    document.getElementById("reset").addEventListener("click", () => {
      if (busy) return;
      newSession(); showEmpty(); input.focus();
    });

    showEmpty();
  </script>
</body>
</html>
