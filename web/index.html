<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>병원 길잡이 Agent</title>
  <meta name="description" content="증상을 말하면 응급실에 가야 할지, 외래라면 어느 진료과로 갈지 근거와 함께 안내하는 학습용 참고 서비스입니다.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@700&family=Instrument+Sans:wght@400;500&family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
        <div>
          <h1>병원 길잡이</h1>
          <p>응급실? 외래? 증상을 말씀해 보세요</p>
        </div>
      </div>
      <div class="topbar-actions">
        <a class="btn btn--call btn--sos" id="call119" href="tel:119" aria-label="119에 전화하기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2.1z"/></svg>
          <span>119 전화</span>
        </a>
        <button class="btn" id="reset" type="button">새 대화</button>
      </div>
    </header>

    <p class="notice">개인 학습용 프로젝트입니다. 안내는 <b>단순 참고용</b>이며 의사의 진단을 대신하지 않습니다. 응급이 의심되면 즉시 <b>119</b>에 연락하세요.</p>

    <main class="chat" id="chat" aria-live="polite"></main>

    <form class="composer" id="form" autocomplete="off">
      <div class="tray">
        <textarea id="input" rows="1" placeholder="증상을 입력하세요" aria-label="증상 입력"></textarea>
        <button class="btn btn--primary" id="send" type="submit">전송</button>
      </div>
      <p class="fine"><span class="hint">Enter로 전송하고 Shift+Enter로 줄을 바꿉니다. </span>이 서비스는 의료 서비스가 아니며 정확성을 보장하지 않습니다.</p>
    </form>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const EXAMPLES = [
      "어제부터 설사랑 극심한 두통이 있어요",
      "가슴이 답답하고 숨이 차요",
      "아이가 밤에 열이 나요",
      "배가 아픈데 어느 과로 가야 하나요?",
      "근처 응급실 정보 좀 알려줘",
    ];

    // session_id: keeps the conversation (multi-turn). sessionStorage may be unavailable, so fall back to memory.
    let sessionId = null;
    function newSession() {
      sessionId = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()) + Math.random().toString(16).slice(2);
      try { sessionStorage.setItem("sid", sessionId); } catch (_) {}
    }
    try { sessionId = sessionStorage.getItem("sid"); } catch (_) {}
    if (!sessionId) newSession();

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function alertIcon() {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("width", "20"); svg.setAttribute("height", "20"); svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none"); svg.setAttribute("stroke", "currentColor"); svg.setAttribute("stroke-width", "2.4");
      svg.setAttribute("stroke-linecap", "round"); svg.setAttribute("stroke-linejoin", "round"); svg.setAttribute("aria-hidden", "true");
      const p = document.createElementNS(ns, "path");
      p.setAttribute("d", "M12 4 3 20h18L12 4zM12 10v4.5M12 17.5v.01");
      svg.appendChild(p);
      return svg;
    }

    // Safe rendering: text only, with **bold** turned into <b> without allowing any HTML from the server.
    function setRichText(node, text) {
      node.textContent = "";
      text.split(/(\*\*[^*]+\*\*)/g).forEach((part) => {
        if (part.startsWith("**") && part.endsWith("**") && part.length > 4) node.appendChild(el("b", "", part.slice(2, -2)));
        else node.appendChild(document.createTextNode(part));
      });
    }

    // The lead sentence of an emergency answer: the number 119 is set large.
    function setLead(node, text) {
      node.textContent = "";
      text.split(/(119)/g).forEach((part) => {
        if (part === "119") node.appendChild(el("span", "n119", part));
        else node.appendChild(document.createTextNode(part));
      });
    }

    function scrollDown() { chat.scrollTop = chat.scrollHeight; }

    function showEmpty() {
      chat.textContent = "";
      const box = el("div", "empty");
      box.appendChild(el("h2", "", "어디가 불편하신가요?"));
      box.appendChild(el("p", "lead", "증상을 말씀하시면 응급실에 가야 할지, 외래라면 어느 과가 좋을지 근거와 함께 안내해 드려요."));
      const chips = el("div", "chips");
      EXAMPLES.forEach((t) => {
        const c = el("button", "btn chip", t);
        c.type = "button";
        c.addEventListener("click", () => send(t));
        chips.appendChild(c);
      });
      box.appendChild(chips);
      chat.appendChild(box);
    }

    function addUser(text) {
      const row = el("div", "row row--user");
      row.appendChild(el("div", "bubble", text));
      chat.appendChild(row);
      scrollDown();
    }

    function addTyping() {
      const row = el("div", "row row--bot");
      const b = el("div", "bubble");
      b.appendChild(el("span", "typing", "답변을 준비하는 중이에요"));
      row.appendChild(b);
      chat.appendChild(row);
      scrollDown();
      return row;
    }

    function addDetails(wrap, title, build) {
      const d = el("details", "details");
      d.appendChild(el("summary", "", title));
      const box = el("div", "box");
      build(box);
      d.appendChild(box);
      wrap.appendChild(d);
    }

    // ---- 링크 만들기: 전화(tel:)는 숫자·하이픈만 남기고, 외부 지도는 새 탭으로 연다
    function link(label, href, external) {
      const a = el("a", "btn btn--sm", label);
      a.href = href;
      if (external) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
      return a;
    }

    // ---- 진료 메모: 답변에서 '**진료 메모'로 시작하는 문단을 떼어 내 카드로 따로 보여 준다
    function splitMemo(text) {
      const paras = text.split("\n\n");
      const i = paras.findIndex((p) => p.startsWith("**진료 메모"));
      if (i === -1) return { body: text, memo: null };
      const memo = paras.splice(i, 1)[0];
      return { body: paras.join("\n\n"), memo };
    }

    // 클립보드에 복사한다 (권한이 없으면 임시 textarea 로 대체)
    async function copyText(text, btn) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (_) {
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch (e) {}
        ta.remove();
      }
      const old = btn.textContent;
      btn.textContent = "복사됨";
      setTimeout(() => { btn.textContent = old; }, 1500);
    }

    function buildMemoCard(memoText) {
      const lines = memoText.split("\n");
      const title = lines[0].replace(/^\*\*|\*\*$/g, "");            // 진료 메모 (병원에서 의사에게 보여 주세요)
      const cut = title.indexOf(" (");
      const card = el("section", "memo");
      const head = el("div", "memo-head");
      head.appendChild(el("h3", "memo-title", cut === -1 ? title : title.slice(0, cut)));
      const copy = el("button", "btn btn--sm", "복사");
      copy.type = "button";
      const plain = lines.map((l) => l.replace(/^\*\*|\*\*$/g, "").replace(/^- /, "")).join("\n");
      copy.addEventListener("click", () => copyText(plain, copy));
      head.appendChild(copy);
      card.appendChild(head);
      if (cut !== -1) card.appendChild(el("p", "memo-hint", title.slice(cut + 2, -1)));
      const dl = el("dl", "memo-list");
      lines.slice(1).forEach((l) => {
        const m = l.match(/^- ([^:]+): (.+)$/);
        if (m) { dl.appendChild(el("dt", "", m[1])); dl.appendChild(el("dd", "", m[2])); }
        else if (l.startsWith("- ")) card.appendChild(el("p", "memo-note", l.slice(2)));
      });
      card.insertBefore(dl, card.querySelector(".memo-note"));
      return card;
    }

    // ---- 응급의료기관 목록: '- 이름 (구분) / 주소 / 전화 번호' 줄을 전화·지도 버튼이 있는 목록으로 바꾼다
    const ROOM_LINE = /^- (.+?) \/ (.+?) \/ 전화 (.*)$/;

    function parseRoom(line) {
      const m = line.match(ROOM_LINE);
      if (!m) return null;
      const k = m[1].match(/^(.*) \(([^()]*)\)$/);
      return { name: k ? k[1] : m[1], kind: k ? k[2] : "", address: m[2], tel: m[3].trim() };
    }

    function buildRooms(lines) {
      const list = el("div", "rooms");
      lines.forEach((line) => {
        const r = parseRoom(line);
        const row = el("div", "room");
        const top = el("div", "room-top");
        top.appendChild(el("strong", "room-name", r.name));
        if (r.kind) top.appendChild(el("span", "room-kind", r.kind));
        row.append(top, el("p", "room-addr", r.address));
        const acts = el("div", "room-actions");
        const digits = r.tel.replace(/[^0-9+\-]/g, "");
        if (digits.replace(/\D/g, "").length >= 4) acts.appendChild(link("전화 " + r.tel, "tel:" + digits));
        // 지도 검색어는 병원 이름이 아니라 주소: 쉼표 뒤의 건물명과 괄호 속 동 이름을 빼서 도로명 주소만 남긴다
        const q = r.address.split(",")[0].replace(/\s*\(.*$/, "").trim() || r.address;
        acts.appendChild(link("카카오맵", "https://map.kakao.com/link/search/" + encodeURIComponent(q), true));
        acts.appendChild(link("네이버지도", "https://map.naver.com/p/search/" + encodeURIComponent(q), true));
        row.appendChild(acts);
        list.appendChild(row);
      });
      return list;
    }

    // 문단마다 보여 준다: 응급의료기관 줄만 모인 문단은 목록으로, 나머지는 글로
    function renderBody(container, text) {
      container.textContent = "";
      text.split("\n\n").forEach((p) => {
        const lines = p.split("\n").filter(Boolean);
        if (lines.length && lines.every((l) => ROOM_LINE.test(l))) {
          container.appendChild(buildRooms(lines));
        } else {
          const d = el("div", "part");
          setRichText(d, p);
          container.appendChild(d);
        }
      });
    }

    // ---- 예/아니오 되묻기: '1. 질문 (예/아니오/모르겠어요)' 줄을 질문 + 선택 버튼으로 바꾼다 (직접 입력도 항상 가능)
    const CLOSED_Q = /^(\d+)\. (.+) \(예\/아니오\/모르겠어요\)$/;
    const OPEN_Q = /^(\d+)\. (.+)$/;
    const CHOICES = ["예", "아니오", "모르겠어요"];

    function buildFollowup(container, text) {
      container.textContent = "";
      const qs = [];   // { q, open, answer }
      const sendRow = el("div", "fq-send");
      const sendBtn2 = el("button", "btn btn--primary fq-submit");
      sendBtn2.type = "button";
      sendBtn2.hidden = true;
      let locked = false;

      function message() {
        return qs.map((x) => "질문: " + x.q + " / 답: " + (x.open ? (x.answer || "") : x.answer)).join("\n");
      }
      function refresh() {
        const closed = qs.filter((x) => !x.open);
        const hasOpen = qs.some((x) => x.open);
        const ready = !locked && closed.length > 0 && closed.every((x) => x.answer);
        sendBtn2.hidden = !ready;
        sendBtn2.textContent = hasOpen ? "답변을 입력창에 넣기" : "답변 보내기";
      }
      function lock() {
        locked = true;
        container.querySelectorAll(".fq-choice").forEach((b) => { b.disabled = true; });
        sendBtn2.hidden = true;
        container.classList.add("fq--done");
      }
      sendBtn2.addEventListener("click", () => {
        if (locked) return;
        if (qs.some((x) => x.open)) {            // 열린 질문이 있으면 자동 전송하지 않고 입력창에 채워 준다
          input.value = message(); autosize(); input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
          return;
        }
        if (busy) return;
        send(message());
        lock();
      });

      text.split("\n\n").forEach((p) => {
        const lines = p.split("\n").filter(Boolean);
        if (!(lines.length && lines.every((l) => OPEN_Q.test(l)))) {
          const d = el("div", "part");
          setRichText(d, p);
          container.appendChild(d);
          return;
        }
        lines.forEach((l) => {
          const mc = l.match(CLOSED_Q);
          const m = mc || l.match(OPEN_Q);
          const item = { q: m[2], open: !mc, answer: "" };
          qs.push(item);
          const box = el("div", "fq");
          box.appendChild(el("p", "fq-text", m[1] + ". " + m[2]));
          if (mc) {
            const group = el("div", "fq-choices");
            group.setAttribute("role", "group");
            group.setAttribute("aria-label", m[1] + "번 질문 답");
            CHOICES.forEach((c) => {
              const b = el("button", "btn fq-choice", c);
              b.type = "button";
              b.setAttribute("aria-pressed", "false");
              b.addEventListener("click", () => {
                if (locked) return;
                item.answer = item.answer === c ? "" : c;
                group.querySelectorAll(".fq-choice").forEach((o) => o.setAttribute("aria-pressed", String(o.textContent === item.answer)));
                refresh();
              });
              group.appendChild(b);
            });
            box.appendChild(group);
          }
          container.appendChild(box);
        });
      });
      sendRow.appendChild(sendBtn2);
      container.appendChild(sendRow);
      refresh();
    }

    function addBot(data, isError) {
      const row = el("div", "row row--bot");
      const wrap = el("div", "stack");
      const bubble = el("div", "bubble");
      const answer = data.answer.trim();
      const isAlert = !isError && answer.startsWith("🚨");
      const { body: answerBody, memo } = isError ? { body: answer, memo: null } : splitMemo(answer);

      if (isAlert) {
        // Emergency answer: ink band. The first paragraph is the lead, the rest follows beneath it.
        const body = answerBody.replace(/^🚨\s*/, "");
        const cut = body.indexOf("\n\n");
        const lead = cut === -1 ? body : body.slice(0, cut);
        const rest = cut === -1 ? "" : body.slice(cut + 2);
        bubble.classList.add("bubble--alert");
        bubble.setAttribute("role", "alert");
        const head = el("div", "alert-head");
        const badge = el("span", "alert-badge");
        badge.appendChild(alertIcon());
        const leadEl = el("p", "alert-lead");
        setLead(leadEl, lead);
        head.append(badge, leadEl);
        bubble.appendChild(head);
        if (rest) {
          const restEl = el("div", "alert-rest");
          setRichText(restEl, rest);
          bubble.appendChild(restEl);
        }
        const call = link("119에 전화하기", "tel:119");   // 응급 안내에는 바로 걸 수 있는 119 버튼을 붙인다
        call.classList.add("btn--call");
        bubble.appendChild(call);
      } else if (answerBody.split("\n").some((l) => ROOM_LINE.test(l))) {
        renderBody(bubble, answerBody);          // 응급의료기관 목록이 있는 답변
      } else if (!isError && answerBody.split("\n").some((l) => CLOSED_Q.test(l))) {
        buildFollowup(bubble, answerBody);       // 예/아니오 되묻기: 선택 버튼
      } else {
        setRichText(bubble, answerBody);
        if (isError) bubble.classList.add("bubble--error");
      }
      wrap.appendChild(bubble);
      if (memo) wrap.appendChild(buildMemoCard(memo));

      if (data.contexts && data.contexts.length) {
        addDetails(wrap, `근거 문서 ${data.contexts.length}건`, (box) => {
          data.contexts.forEach((c) => {
            const it = el("div", "item");
            it.appendChild(el("code", "", c.doc_id));
            it.appendChild(document.createTextNode("\n" + c.text));
            box.appendChild(it);
          });
        });
      }
      if (data.trace && data.trace.length) {
        addDetails(wrap, `처리 과정 ${data.trace.length}단계`, (box) => {
          data.trace.forEach((s) => {
            const it = el("div", "item");
            it.appendChild(el("code", "", s.step));
            it.appendChild(document.createTextNode(`\n입력: ${s.input}\n출력: ${s.output}`));
            box.appendChild(it);
          });
        });
      }
      row.appendChild(wrap);
      chat.appendChild(row);
      scrollDown();
    }

    let busy = false;
    async function send(text) {
      text = (text || "").trim();
      if (!text || busy) return;
      if (chat.querySelector(".empty")) chat.textContent = "";
      busy = true; sendBtn.disabled = true; sendBtn.setAttribute("aria-busy", "true");
      addUser(text);
      input.value = ""; autosize();
      const typing = addTyping();
      try {
        const res = await fetch("/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: text, session_id: sessionId }),
        });
        if (!res.ok) throw new Error("서버 응답 오류 (" + res.status + ")");
        const data = await res.json();
        typing.remove();
        addBot(data, false);
      } catch (err) {
        typing.remove();
        addBot({ answer: "답변을 받지 못했어요. 잠시 후 다시 시도해 주세요.\n(" + err.message + ")", contexts: [], trace: [] }, true);
      } finally {
        busy = false; sendBtn.disabled = false; sendBtn.removeAttribute("aria-busy"); input.focus();
      }
    }

    function autosize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 144) + "px";
    }

    form.addEventListener("submit", (e) => { e.preventDefault(); send(input.value); });
    input.addEventListener("input", autosize);
    // Enter sends; Shift+Enter = newline; ignore Enter while a Korean IME is still composing a syllable.
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
        e.preventDefault();
        send(input.value);
      }
    });
    document.getElementById("reset").addEventListener("click", () => {
      if (busy) return;
      newSession(); showEmpty(); input.focus();
    });

    showEmpty();
  </script>
</body>
</html>
